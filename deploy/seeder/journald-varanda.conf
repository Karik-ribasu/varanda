# Retenção provisória dos registros do semeador sob systemd (README, seção
# "Política de registros"). Pendente do parecer jurídico sobre o Art. 15 do
# Marco Civil (issue #38): ajuste MaxRetentionSec quando ele sair.
#
# Copie para /etc/systemd/journald.conf.d/varanda.conf e rode
# `sudo systemctl restart systemd-journald`. Vale para o journal inteiro da
# máquina: use numa máquina dedicada ao semeador.
[Journal]
Storage=persistent
MaxRetentionSec=30day
SystemMaxUse=1G
